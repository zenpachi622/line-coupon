<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VIPクーポン</title>
</head>
<body>

<h1>読み込み中...</h1>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

async function main(){

  // LIFF初期化
  await liff.init({
    liffId: "2010165360-1V2UTGoZ"
  });

  // ログイン確認
  if(!liff.isLoggedIn()){
    liff.login();
    return;
  }

  // LINEプロフィール取得
  const profile = await liff.getProfile();

  // GASから情報取得
  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbztrHzm629d7qsOwOgw8-0higHPpQ6fr3Jwaya5mV7e_EAU79ZNu16JhOHVvdNoOTeokg/exec?userId=" + profile.userId
  );

  const data = await response.json();

  console.log(data);

  // VIP判定
  if(data.status === "VIP"){

    document.body.innerHTML = `
      <h1>VIPクーポン</h1>
      <p>${data.name}様</p>
      <h2>${data.coupon}</h2>
    `;

  } else {

    document.body.innerHTML = `
      <h1>審査中です</h1>
    `;
  }

}

main();

</script>

</body>
</html>
