<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>善八VIPクーポン</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      font-family:sans-serif;
      background:#faf7f2;
    }

    iframe{
      border:none;
      width:100%;
      height:100vh;
    }

  </style>
</head>

<body>

<iframe id="frame"></iframe>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

async function main(){

  try{

    await liff.init({
      liffId:"2010165360-1V2UTGoZ"
    });

    if(!liff.isLoggedIn()){

      liff.login();
      return;
    }

    const profile = await liff.getProfile();

    const url =
      "https://script.google.com/macros/s/AKfycbxjovHbvOES9ruBssUPQWk_uglEx1YItpKUI0AxqlytcWoImXXcJrTiZ6ktrN5dS7K8Zw/exec"
      + "?userId=" + encodeURIComponent(profile.userId)
      + "&name=" + encodeURIComponent(profile.displayName);

    document.getElementById("frame").src = url;

  }catch(err){

    document.body.innerHTML = `
      <div style="
        padding:40px;
        text-align:center;
        font-size:20px;
      ">
        通信エラー<br><br>
        ${err}
      </div>
    `;
  }
}

main();

</script>

</body>
</html>
